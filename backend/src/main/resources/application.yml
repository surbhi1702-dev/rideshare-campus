server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: rideshare-campus
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rideshare}
    username: ${DB_USERNAME:rideshare}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.rideshare: ${LOG_LEVEL:INFO}

# ---------------------------------------------------------------------
# Application configuration (all overridable through environment vars)
# ---------------------------------------------------------------------
app:
  # Departure times are interpreted in this zone (institute local time).
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}

  auth:
    # Comma separated list. Only emails ending in @<domain> may register.
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:iitbbs.ac.in}

  jwt:
    # Base64 encoded key of at least 256 bits. Required - no default on purpose.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  admin:
    # If both are set, an ADMIN account is created on startup (once).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Platform Admin}

  ride:
    max-seats: ${RIDE_MAX_SEATS:7}
    max-days-ahead: ${RIDE_MAX_DAYS_AHEAD:60}
    min-trip-distance-km: ${RIDE_MIN_TRIP_DISTANCE_KM:0.5}
    # A student cannot be in two active rides departing within this window.
    overlap-window-minutes: ${RIDE_OVERLAP_WINDOW_MINUTES:90}
    # How early before departure the creator may mark a ride as started.
    start-early-window-minutes: ${RIDE_START_EARLY_WINDOW_MINUTES:60}
    # Seat lock wait before a join/leave request gives up with 409.
    lock-timeout-ms: ${RIDE_LOCK_TIMEOUT_MS:3000}

  matching:
    max-pickup-distance-km: ${MAX_PICKUP_DISTANCE_KM:3.0}
    max-destination-distance-km: ${MAX_DESTINATION_DISTANCE_KM:5.0}
    max-time-difference-minutes: ${MAX_TIME_DIFFERENCE_MINUTES:60}
    max-results: ${MATCH_MAX_RESULTS:20}
    suggestion-notification-limit: ${MATCH_SUGGESTION_LIMIT:10}
    weights:
      pickup: ${MATCH_WEIGHT_PICKUP:0.30}
      destination: ${MATCH_WEIGHT_DESTINATION:0.35}
      time: ${MATCH_WEIGHT_TIME:0.25}
      group: ${MATCH_WEIGHT_GROUP:0.10}

  # Common pickup / drop points offered in the UI (approximate coordinates;
  # adjust for your campus). Custom points can always be entered by lat/lng.
  places:
    - name: IIT Bhubaneswar (Argul Campus)
      latitude: 20.1484
      longitude: 85.6706
    - name: Bhubaneswar Railway Station
      latitude: 20.2667
      longitude: 85.8434
    - name: Biju Patnaik International Airport
      latitude: 20.2444
      longitude: 85.8178
    - name: Baramunda Bus Stand
      latitude: 20.2805
      longitude: 85.7980
    - name: Khurda Road Junction (Jatani)
      latitude: 20.1647
      longitude: 85.6187
    - name: Master Canteen Square
      latitude: 20.2687
      longitude: 85.8428
    - name: Patia / KIIT Square
      latitude: 20.3538
      longitude: 85.8190
    - name: Esplanade One Mall (Rasulgarh)
      latitude: 20.2906
      longitude: 85.8579
    - name: Cuttack Railway Station
      latitude: 20.4644
      longitude: 85.8990
    - name: Puri Railway Station
      latitude: 19.8156
      longitude: 85.8323
