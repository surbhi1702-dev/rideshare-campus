# Full stack: PostgreSQL + Spring Boot API + React (nginx).
#   cp .env.example .env    # then set real secrets
#   docker compose up --build
# App: http://localhost:3000   API docs: http://localhost:3000/swagger-ui.html

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rideshare}
      POSTGRES_USER: ${POSTGRES_USER:-rideshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rideshare} -d ${POSTGRES_DB:-rideshare}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rideshare}
      DB_USERNAME: ${POSTGRES_USER:-rideshare}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-15}
      # nginx forwards the client IP; trust it for rate limiting.
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-framework}
      # Plain http://localhost here; set true when served over HTTPS.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-iitbbs.ac.in}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Kolkata}
      MAX_PICKUP_DISTANCE_KM: ${MAX_PICKUP_DISTANCE_KM:-3.0}
      MAX_DESTINATION_DISTANCE_KM: ${MAX_DESTINATION_DISTANCE_KM:-5.0}
      MAX_TIME_DIFFERENCE_MINUTES: ${MAX_TIME_DIFFERENCE_MINUTES:-60}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
